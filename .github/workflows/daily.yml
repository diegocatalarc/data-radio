name: Meridiano diario

on:
  schedule:
    - cron: "17 10 * * *"   # todos los días 10:17 UTC
  workflow_dispatch:         # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meridiano
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e pipeline
      - name: Ejecutar pipeline editorial
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m meridiano run
        working-directory: pipeline
      - name: Guardar notas nuevas
        run: |
          git config user.name "meridiano-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/src/content/notas pipeline/state/seen.json
          git diff --cached --quiet || (git commit -m "Notas del día" && git push)

  publicar:
    needs: generar
    uses: ./.github/workflows/deploy.yml
